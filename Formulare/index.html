<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Formular</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
  
<h1>Formular</h1>

<form action="mailto:reh250625@spengergasse.at?subject=Mein%20Formular" method="post" enctype="text/plain">

    <fieldset>
    <legend>Persönliche Daten</legend>
    <label for="vorname">Vorname:</label>
    <input type="text" id="vorname" name="vorname" required>

    <label for="nachname">Nachname:</label>
    <input type="text" id="nachname" name="nachname" required>

    <label for="benutzername">Benutzername:</label>
    <input type="text" id="benutzername" name="benutzername" required>

    <label for="geburtsdatum">Geburtsdatum:</label>
    <input type="date" id="geburtsdatum" name="geburtsdatum">
</fieldset>

<fieldset>
    <legend>Passwort</legend>
    <label for="passwort">Passwort:</label>
    <input type="password" id="passwort" name="passwort" required>
</fieldset>

<fieldset>
    <legend>Geschlecht</legend>
    <label for="maeennlich">Männlich</label>
    <input type="radio" id="maeennlich" name="geschlecht" value="maeennlich" required>
    <label for="weiblich">Weiblich</label>
    <input type="radio" id="weiblich" name="geschlecht" value="weiblich"> 
</fieldset>

<fieldset>
    <legend>Hobby</legend>
    <label for="sport">Sport</label>
    <input type="checkbox" id="sport" name="hobby" value="sport">

    <label for="musik">Musik</label>
    <input type="checkbox" id="musik" name="hobby" value="musik"> 

    <label for="lesen">Lesen</label>
    <input type="checkbox" id="lesen" name="hobby" value="lesen">

</fieldset>

<fieldset>
    <legend>Land</legend>
    <label for="land">Land:</label>
    <select id="land" name="land">
        <option value="">Bitte wählen</option>
        <option value="at">Österreich</option>
        <option value="de">Deutschland</option>
        <option value="ch">Schweiz</option>
        <option value="it">Italien</option>
    </select>
 </fieldset>

<fieldset>
    <legend>Sprachen</legend>
    <label for="sprachen">Sprachen:</label>
    <select id="sprachen" name="sprachen" multiple>
        <option value="de">Deutsch</option>
        <option value="en">Englisch</option>
        <option value="fr">Französisch</option>
        <option value="it">Italienisch</option>
        <option value="es">Spanisch</option>
        <option value="ru">Russisch</option>
        <option value="jp">Japanisch</option>
    </select>
</fieldset>

<fieldset>
    <legend>Kontakt</legend>
    <label for="adresse">Adresse:</label>
    <textarea id="adresse" name="adresse" rows="3" cols="30" placeholder="Straße, PLZ, Ort"></textarea>
   
    <label for="email">E-Mail:</label>
    <input type="email" id="email" name="email" placeholder="name@beispiel.at">
    
    <label for="telefon">Telefon:</label>
    <input type="tel" id="telefon" name="telefon"
       pattern="[0-9]{8,15}">
</fieldset>

<input type="submit" value="Absenden">
</form>
</body>
</html>
